<script>
  function switchSection(sectionId) {
    // 1. Ocultar todas las secciones contenedoras
    const sections = ['cierre', 'anuncio', 'stories', 'planes', 'flyers', 'marca', 'camara', 'agente'];
    sections.forEach(id => {
      const el = document.getElementById('sec-' + id);
      if (el) el.classList.add('hidden');
    });

    // 2. Mostrar la sección seleccionada
    const targetSection = document.getElementById('sec-' + sectionId);
    if (targetSection) {
      targetSection.classList.remove('hidden');
    }

    // 3. Cambiar estilos visuales de los botones
    sections.forEach(id => {
      const btn = document.getElementById('nav-' + id);
      if (btn) {
        btn.classList.remove('bg-cian-guaros', 'text-white', 'border-blue-950');
        btn.classList.add('bg-gray-200', 'text-gray-600', 'border-gray-400');
      }
    });

    const activeBtn = document.getElementById('nav-' + sectionId);
    if (activeBtn) {
      activeBtn.classList.remove('bg-gray-200', 'text-gray-600', 'border-gray-400');
      activeBtn.classList.add('bg-cian-guaros', 'text-white', 'border-blue-950');
    }
  }
</script>
